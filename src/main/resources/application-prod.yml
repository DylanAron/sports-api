server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/sports-admin?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true
    username: root
    password: ${DB_PASSWORD:root}
  data:
    redis:
      host: ${REDIS_HOST:localhost}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

jwt:
  secret: ${JWT_SECRET:sports-api-secret-key-2024-please-change-in-production-environment}
  expiration: 604800000
