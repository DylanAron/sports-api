# 应用配置
server:
  port: 8086
  address: 0.0.0.0

# Spring 配置
spring:
  application:
    name: sports-api
  # 数据源
  datasource:
    url: jdbc:mysql://localhost:3306/sports-admin?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  # Redis
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0
  profiles:
    active: dev

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.sports.api.**.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# JWT
jwt:
  secret: sports-api-secret-key-2024-please-change-in-production-environment
  expiration: 604800000  # 7天（毫秒）
